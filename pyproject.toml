[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miniredis"
description = "A small Redis-compatible in-memory database written in Python"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
authors = [{ name = "miniredis contributors" }]
keywords = ["redis", "resp", "in-memory", "database", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
miniredis = "miniredis.cli:main"
miniredis-cli = "miniredis.client:main"

[tool.setuptools.dynamic]
version = { attr = "miniredis.__version__" }

[tool.setuptools.packages.find]
include = ["miniredis*"]
